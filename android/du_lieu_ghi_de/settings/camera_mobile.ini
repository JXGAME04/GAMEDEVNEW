; [CAMERA 13/09] Tham so camera theo MAP cho dien thoai (nhu cameraInit cua game 3D Kiem Vong Giang Ho).
; Tep nay o settings\camera_mobile.ini (bo tai dt_v4 gui xuong dien thoai; sua xong khoi dong lai may chu 8765 de manifest moi).
; [MacDinh] ap cho moi map; [Map_<id>] ghi de tung khoa cho map <id> (= so thu tu trong settings\maplist.ini,
;   vi du 1 = Phuong Tuong, 11 = Thanh Do, 37 = Bien Kinh, 44 = Chien truong Tong Kim, 78 = Tuong Duong, 80 = Duong Chau).
; Khoa (map khong ghi = lay [MacDinh]; [MacDinh] khong ghi = lay config.ini [Cham]):
;   ZoomMacDinh = % nhin rong khi vao map (100 = 1:1, 120 = thay rong hon 1,2 lan moi chieu)
;   ZoomToiDa   = % chum hai ngon toi da (100..300; map dong nguoi nen thap de GPU khong qua tai)
;   LiaXaNgang / LiaXaDoc = lia mot ngon xa toi da, % be rong / chieu cao khung ve (0 = khong lia duoc)
;   LiaCanh = 1/0 bat/tat lia mot ngon (0: chum hai ngon van zoom nhung khong lia); ZoomCanh = 1/0 bat/tat chum (0 = zoom ve 100)
; Zoom nguoi choi da chum duoc NHO (UserData\CameraMobile.ini, config.ini [Cham] ZoomNho=1) va THANG ZoomMacDinh cua map,
;   nhung van bi kep boi ZoomToiDa cua map. Xoa tep UserData\CameraMobile.ini (hay dat ZoomNho=0) de ve ZoomMacDinh.
; Vao map: 1 s sau doc muc roi zoom TROI dan toi dich voi toc do config.ini [Cham] ZoomTocDo (%/giay), chu "Nhin rong NNN %" 1,5 s.

[MacDinh]
ZoomMacDinh=100
ZoomToiDa=150
LiaXaNgang=60
LiaXaDoc=60
LiaCanh=1
ZoomCanh=1

; Thanh lon: vao map nhin rong san 120 % cho de thay NPC / duong di
[Map_1]
ZoomMacDinh=120
[Map_11]
ZoomMacDinh=120
[Map_37]
ZoomMacDinh=120
[Map_78]
ZoomMacDinh=120
[Map_80]
ZoomMacDinh=120

; Chien truong Tong Kim: dong nguoi -> chum toi da 125 % de GPU khong qua tai
[Map_44]
ZoomToiDa=125
