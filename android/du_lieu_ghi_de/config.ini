[Server]
GameServPort=5622

[Client]
FullScreen=0
Represent=3
PaintFps=120
PaintInterp=1
PaintLog=1
AutoLog=1
PerfHud=0
; [REP3 07/09] Ngan sach bo nho anh (texture) cua Represent3, don vi MB. 0 = tu tinh = RAM/16 nhung
; BI KEP TOI DA 512 MB (TextureResMgr.cpp:97). Do live 17:40: cache dinh o 508-511/512 MB suot tran,
; moi luot lam sach bo bot khung anh cua tai nguyen nghi > 1 giay -> hieu ung chieu (dung thua, moi lan
; cach nhau > 1 giay) bi bo roi phai nap lai => 'dang danh mat het hinh anh ky nang, chi thay dong tac danh'.
; May nay RAM 32 GB, VRAM con trong 3.580 MB nen dat 1500 MB. Muon lui: xoa dong nay (hoac dat 0).
Rep3CacheMB=1500
Rep3Ex=0
Rep3Api=100
FPS=0


CapPath=.\JxCap
DynamicLight=0

[Resolution]
; [ANDROID 09/09 DPG] Tren Android hai dong Width/Height duoi day BI BO QUA khi TheoManHinh=1.
Width=1024
Height=768
; 1 = khung ve tu tinh theo man hinh thiet bi (giu dung ti le may, khong vien den, khong meo). 0 = dung Width/Height.
TheoManHinh=1
; Chieu cao khung ve mong muon (px). NHO hon = giao dien TO hon (va mo hon); LON hon = net hon (va nho hon).
;   640 = mac dinh (giua 604 da chay tot va 768 goc cua game)
ChieuCaoMucTieu=640
; 0 = tu chon he so theo ChieuCaoMucTieu. Muon ep: 100=1,00  125=1,25  150=1,50  175=1,75  200=2,00  250  300
HeSoGiaoDien=0

[Login]
; [ANDROID 09/09] 1 = da bam "Ghi nho" o man dang nhap thi lan sau mo app la vao thang game.
;                 0 = luon dung lai o man hinh chinh.
TuDongDangNhap=1

[Ui]
; [UITOADO] 1 = cho bat che do sua giao dien trong game
;           (Ctrl+U bat/tat, Ctrl+K xoa het toa do da tu dat).
; Ban phat hanh cho nguoi choi thi de 0 hoac xoa han muc nay.
SuaToaDo=1
; [ANDROID 10/09] nut "Sua giao dien" doi len (200,40) - goc phai duoi ban do nho danh cho cot icon + 4 o vat pham (bo cuc VNKU)
SuaToaDoNutX=200
SuaToaDoNutY=40
