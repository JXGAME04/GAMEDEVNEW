[Server]
GameServPort=5622

[Client]
FullScreen=0
Represent=3
; [ANDROID 11/09] -1 = theo tan so man hinh (60 tren LDPlayer / da so dien thoai). 120 chi tang vong lap len 1 ms va ton pin, man 60 Hz khong ve them duoc.
PaintFps=-1
PaintInterp=1
; [DONHIP 12/09 d] nhip PC cho mobile (do Fold 7 SDL 3.2.30, BANGIAO_DONHIP_MOBILE_1209.md muc 9): PaintVsync=1 ve theo vblank,
;   PaintSmooth=2 lap lich nhu [NHIP a-e] cua PC -> p99 16-19 ms thay vi 26-28, it khung tre hon; khong thua o buoc do nao. 0/1 = nhip cu.
PaintVsync=1
PaintSmooth=2
; [VE 11/09] nap KHUNG sprite o luong nen (Represent3, chi Android): NapKhungNen 1 bat / 0 nhu cu; NapKhungMs = ngan sach giai ma DONG BO tren luong ve
;   moi khung (ms), qua thi giao luong nen va bo ve khung do mot khung; NapKhungTruoc = so khung ke tiep cung huong nap truoc; NapKhungApMs = ngan sach
;   tao texture tu ket qua luong nen moi khung (ms); VeGiatMs = nguong ghi [VE-GIAT] (ve CPU + trinh chieu) vao jx_rep3.log, 0 = tat. Thong ke [VE]/[VE-GOP]/[VE-NAP] moi 30 s.
NapKhungNen=1
NapKhungMs=3
NapKhungTruoc=2
NapKhungApMs=3
VeGiatMs=20
; [VE 11/09 d] NapHoiKhongDe=1: hoi kich thuoc sprite NPC (KNpcRes) dang nap o luong nen -> tra 'chua co', khung sau hoi lai (0 = nap dong bo de len nhu cu)
NapHoiKhongDe=1
; [VE 11/09 e] Rep3AtlasKe=1: atlas xep ke theo dinh dang (khung cung NPC nam cung trang -> gop lenh ve; 0 = trang theo bin cao nhu cu); Rep3AtlasTrang: co trang 1024/2048/4096
Rep3AtlasKe=1
Rep3AtlasTrang=2048
; [PALBUF 11/09] Rep3PalBuffer=1: bang mau trong storage buffer 8 MB, hang moi tai bang lenh copy buffer -> het khung "chep" 17-100 ms moi khi co sprite moi
;   (log Fold 7 11:48: 260/260 khung chep cham la khung tai hang bang mau vao texture 256x8192). 0 = texture nhu cu. [VE] ghi "bang mau kieu ...", [VE-GIAT] "pal lenh".
Rep3PalBuffer=1
; [BKG 11/09] Rep3BoKhungGiong=1: khung ve giong HET khung vua trinh chieu (lenh + dinh, khong texture cho tai) thi KHONG trinh chieu - man hinh giu nguyen, pixel y het,
;   bot ghi lenh + nop + viec GPU (canh yen phan lon khung giong nhau). 0 = chi dem (xem [VE-BKG] trong jx_rep3.log), -1 = tat han.
;   Rep3BoKhungGiongMs = toi da ms giua hai lan trinh chieu khi khung giong (0 = khong gioi han); cua so/be mat doi thi trinh chieu ngay.
Rep3BoKhungGiong=1
Rep3BoKhungGiongMs=250
; [FPSNGOAI 11/09] FpsNgoaiTheGioi=30: nhip ve khi chua vao the gioi (dang nhap, chon nhan vat) + xin man 60 Hz; vao the gioi ap lai nac nguoi choi chon (0 = tat)
FpsNgoaiTheGioi=30
; [D1 11/09] Rep3SwapchainLogic=100: swapchain (khung GPU to) = khung logic 1040x936 / 1436x616 thay vi cua so 2184x1968 / 2520x1080, man hinh (HWC) phong len
;   -> GPU to it diem hon 3-4,4 lan (Fold 7 14:16 Tong Kim: GPU 82-99 % ban). 150 = 1,5x (net hon, ton hon), 0 = cua so nhu cu. [D1] trong jx_rep3.log.
Rep3SwapchainLogic=100
; [GOP 11/09] Rep3PsBuffer=1: trang thai tang texture (colorop/alphaop/alpha test) cua ca khung nam trong mot storage buffer, chi so di theo DINH
;   -> khong con ~800 lan day uniform moi khung va hai quad chi khac trang thai van gop chung mot lenh ve. 0 = nhu ban 109111459.
Rep3PsBuffer=1
; [GOP 11/09] Rep3BindRing=1: bind bo dem dinh MOT lan moi render pass, moi lenh ve dung first_vertex -> bot 1 lenh Vulkan cho moi draw
;   (Tong Kim 1 818 draw/khung). 0 = bind rieng tung lenh nhu cu. Xem [VE-GOP] "ps bang N muc" trong jx_rep3.log.
Rep3BindRing=1
; [MANG 11/09] Rep3AtlasMangGpu=1: nhieu trang atlas nam trong MOT texture mang 2D (moi trang mot lop, chi so lop di theo dinh)
;   -> hai sprite o hai trang van gop chung mot lenh ve (truoc: doi texture 950-1200 lan moi khung luc dong). 0 = tung trang mot texture.
;   Rep3AtlasLop = so lop toi da moi cum (cum dau 2 lop, cum sau gap doi); Rep3AtlasCumMB = ngan sach byte moi cum.
; DA TAT 16:30 sau khi do Fold 7 (phien 162152): gop lenh CO giam (doi texture 1043 -> 508, lenh 2001 -> 1222) nhung nop 1,42 -> 3,28 ms
;   va ve CPU 2,96 -> 4,51 ms -> fps tut, giat khi di chuyen man hinh. Ten khoa doi thanh Rep3AtlasMangGpu de khong trung khoa Rep3AtlasMang cua duong D3D11.
Rep3AtlasMangGpu=0
Rep3AtlasLop=8
Rep3AtlasCumMB=64
PaintLog=0
AutoLog=0
; [ANDROID 11/09 HUD] 1 = hien bang do FPS / khung ve / CPU / RAM / pin / GPU o giua, duoi hang nut menu tren cung (3 dong). 0 = tat. PerfHudX/PerfHudY = vi tri (px), -1 = tu tinh.
PerfHud=0
PerfHudX=-1
PerfHudY=-1
; [THONGTIN 12/09] 1 = dong "60 FPS | CPU | GPU | Pin | ms" o goc phai tren nhu game mobile khac (khong phai bang do PerfHud);
;   keo cho khac trong "Sua giao dien" (khoa ThongTinGoc). 0 = tat. Muc khung hinh/giay: thanh FPS trong cua so Cai dat.
ThongTinGoc=1
; [REP3 07/09] Ngan sach bo nho anh (texture) cua Represent3, don vi MB. 0 = tu tinh = RAM/16 nhung
; BI KEP TOI DA 512 MB (TextureResMgr.cpp:97). Do live 17:40: cache dinh o 508-511/512 MB suot tran,
; moi luot lam sach bo bot khung anh cua tai nguyen nghi > 1 giay -> hieu ung chieu (dung thua, moi lan
; cach nhau > 1 giay) bi bo roi phai nap lai => 'dang danh mat het hinh anh ky nang, chi thay dong tac danh'.
; May nay RAM 32 GB, VRAM con trong 3.580 MB nen dat 1500 MB. Muon lui: xoa dong nay (hoac dat 0).
; [ANDROID 11/09 CACHE] 1500 la so cua PC 32 GB RAM. Dien thoai / may ao: de 0 = tu tinh (RAM/16, kep them theo 'VRAM' ao cua
; SDL_GPU). Tren Android tu tinh = RAM/8 kep 128..512 MB; con kep <= RAM/3 ke ca khi ep so o day. Nho hon = giai ma lai nhieu hon (lag khi dong nguoi);
; lon hon = de bi he thong giet app vi thieu RAM.
Rep3CacheMB=0
; [ANDROID 11/09 ATLAS] 1 = gom texture sprite nho vao trang 1024x1024 tren lop SDL_GPU (nhu D3D11 tren PC). 0 = moi khung mot texture (cu).
Rep3AtlasGpu=1
; [ANDROID 11/09 BOCPU] 1 = bo ban CPU cua texture sprite sau khi da tai len GPU (RAM = 1x cache thay vi 2x). 0 = giu nhu cu.
Rep3GpuBoBanCpu=1
; [ANDROID 11/09 MAILBOX] 1 = khi may khong co present mode IMMEDIATE (LDPlayer, dien thoai) thi dung MAILBOX: khong cho vblank, khong xe hinh. 0 = vsync nhu cu.
; [ANDROID 11/09 b] tat mac dinh: chu thay rung man hinh khi bat
Rep3GpuMailbox=0
Rep3Ex=0
Rep3Api=100
FPS=0


CapPath=.\JxCap
DynamicLight=0

[Resolution]
; [ANDROID 09/09 DPG] Tren Android hai dong Width/Height duoi day BI BO QUA khi TheoManHinh=1.
Width=1024
Height=768
; 1 = khung ve tu tinh theo man hinh thiet bi (giu dung ti le may, khong vien den, khong meo). 0 = dung Width/Height.
TheoManHinh=1
; Chieu cao khung ve mong muon (px). NHO hon = giao dien TO hon (va mo hon); LON hon = net hon (va nho hon).
;   640 = mac dinh (giua 604 da chay tot va 768 goc cua game)
ChieuCaoMucTieu=640
; 0 = tu chon he so theo ChieuCaoMucTieu. Muon ep: 100=1,00  125=1,25  150=1,50  175=1,75  200=2,00  250  300
HeSoGiaoDien=0
; [KHUNG 13/09 HAIHO] 1 = khung ve HAI HO (he so phong lay so le): dien thoai (man dai, ti le >= 1040/616) cao DUNG
;   CaoDienThoai, rong theo ti le may; may tinh bang / man gan vuong rong DUNG RongMayTinhBang, cao theo ti le may.
;   Moi may chi khac nhau MOT chieu -> bo cuc neo chi chia phan du cua mot chieu. 0 = cach cu (nac tron o tren).
KhungHaiHo=1
CaoDienThoai=616
RongMayTinhBang=1040

[Login]
; [ANDROID 09/09] 1 = da bam "Ghi nho" o man dang nhap thi lan sau mo app la vao thang game.
;                 0 = luon dung lai o man hinh chinh.
;   [DANGNHAP 14/09] chu: nho tai khoan + mat ma nhung KHONG tu dang nhap -> mac dinh 0; o mat ma hien 8 dau *, bam Dang nhap la vao.
TuDongDangNhap=0

[Ui]
; [UITOADO] 1 = cho bat che do sua giao dien trong game
;           (Ctrl+U bat/tat, Ctrl+K xoa het toa do da tu dat).
; Ban phat hanh cho nguoi choi thi de 0 hoac xoa han muc nay.
SuaToaDo=1
; [ANDROID 10/09] nut "Sua giao dien" doi len (200,40) - goc phai duoi ban do nho danh cho cot icon + 4 o vat pham (bo cuc VNKU)
SuaToaDoNutX=200
SuaToaDoNutY=40
; [SUAGD 13/09] trinh chinh giao dien cho NGUOI CHOI (cham chon, keo, chum hai ngon, bang mui ten 1 diem):
;   BatDinh=1 : keo thi bat dinh vao mep / tam o khac va mep vung an toan (co duong giong)
;   SuaToaDoChu=1 : hien nut "Luu mac dinh" (chu game) - ghi bo cuc hien tai lam mac dinh cua game cho ho khung nay.
;                   Ban phat hanh cho nguoi choi: dat 0.
;   NhatKyBoCuc=1 : 3 giay sau khi vao the gioi ghi bocuc_thuc.txt (khung, vung an toan, toa do that moi o) de doi chieu may that
BatDinh=1
; [PHONGBANG 14/09] bang tinh nang (hanh trang, ruong, giao dich, cua hang, Auto, ESC, tuy chon, nhan vat, vo cong, bang hoi, to doi,
;   thu, dau gia) phong CA CAY theo man hinh luc mo: k = min(khung rong / rong bang, khung cao / cao bang) x 0,96, chan tran
;   PhongBang (phan nghin: 1400 = toi da 1,4 lan; 0 = tat). Bang cao 454 tren dien thoai chi toi ~1,3 vi khung cao 616.
;   Giu nguyen anh / bo cuc / chu, khong chum tay; o vat pham to theo bang.
;   Khung dang nhap (KUiLogin 800x600, hop o giua) phong dung tran nay, can giua khung (co 32 trong danh sach trang).
PhongBang=1400
SuaToaDoChu=1
NhatKyBoCuc=1
; [ANTOAN 13/09] VUNG AN TOAN (tai tho / lo camera / vung vuot he thong, SDL_GetWindowSafeArea) lam khong gian neo cua HUD:
;   VungAnToan=1 (0 = bo qua inset, neo theo mep man); VungAnToanDoiXung=1 = le lon hon cua hai mep trai/phai ap cho ca hai
;   [ANTOAN 13/09 c] Chu 13/09: "khong can vung an toan, game khac dau co" -> mac dinh VungAnToan=0 (neo theo mep man, bo qua inset).
;   Bat lai =1 thi inset CHI la cho khoet camera (JxActivity.JxSurface), khong con thanh he thong / vung cu chi;
;   mac dinh khong doi xung (=0) de mep khong co camera dung sat man - chu 13/09: dien thoai phai cang het man.
;   (xoay 180 do bo cuc khong doi); LeAnToan = le co dinh them vao bon phia (goc bo tron), diem anh khung ve.
VungAnToan=0
VungAnToanDoiXung=0
LeAnToan=0

[Cham]
; [VATPHAM 12/09 g] 1 = ghi nhat ky chan doan "giu ngon lau tren o vat pham" ra logcat
NhatKyGiu=0
; [ANDROID 11/09 CAN] can dieu khien ao: moi lan gui lenh di thi dich xa bao nhieu buoc (8 = mac dinh; 2 = dich gan nhu ban cu).
; [ANDROID 11/09 b] 2 = dich gan nhu ban cu (mac dinh); 8 + CanGacTick=5 = giong chuot PC (it goi nhat)
CanBuocXa=2
; [ANDROID 11/09 b] gui lenh di toi da 1 lan / n tick (1 tick ~ 55 ms). 1 = ~18 goi/giay (truoc day 125..1000); 5 = nhu chuot PC
CanGacTick=1
; [ANDROID 11/09 b] luan chuyen vong sang moi bao nhieu ms (chu muon nhanh hon 500)
LuanChuyenMs=300
; [ANDROID 11/09 ICON b] icon tren dau NPC doi thoai gan nhat: nut "Giao tiep" cua kho VNKU; cham vao = di toi NPC + mo thoai.
;   IconNpcRong = co ve (px); IconNpcGan = khoang cach hien icon (px man hinh); IconNpc=0 de tat.
; [ANDROID 11/09 ICON e] icon nam CO DINH tren man hinh (mac dinh goc phai), chi hien khi NPC doi thoai gan nhat cach nhan vat <= IconNpcGan px;
;   keo cho khac trong che do "Sua giao dien" (khoa IconNpc, UserData\UiToaDo.ini). Cham icon = di toi NPC + mo thoai.
IconNpcAnh=\spr\UiNew\UiToolsControlBar\doi_thoai.spr
IconNpcRong=44
IconNpcGan=130

[DoNhip]
; [DONHIP 12/09] BAN DO NHIP VE tren dien thoai that. 1 = vao the gioi 10 s thi tu chay lan luot cac pha (moi pha GiayMoiPha giay,
;   LanLap vong; dong chu vang giua man hinh cho biet pha dang chay), ghi jx_nhip.log + jx_thietbi.log va gui log ve may chu tai
;   (<URL may chu tai>/nhatky -> D:\jx1_android_log tren may chu). Het vong thi tra ve pha 0 (hanh vi cu). 0 = tat han (mac dinh).
;   [DONHIP 12/09 b] SDL Android 3.2.30 (khong dung lai swapchain vi SUBOPTIMAL - Fold 7 45 -> 120 fps). Bang pha moi (Pha=0,1,2,3,4 mac dinh):
;     0 SDL moi, nhip cu (PaintVsync=0, PaintSmooth=1) | 1 +nhip PC (PaintVsync=1, PaintSmooth=2) | 2 +bo chep khung moi khung, van 2 khung bay
;     3 +xin man 60 Hz, PaintFps=60 (nac tiet kiem pin) | 4 1 khung bay (doi chung) | 5 SDL cu: dung lai swapchain moi khung (doi chung, phai ghi ro)
;   Dong ho pha dung khi app ra nen ([NHIP-NGHI]); GiayMoiPha=60, LanLap=2 -> 10 phut.
Bat=0
; [DAN 11/09 e] GuiLog=1 = chi GUI log (jx_nhip/thietbi/paint/rep3/android/mail) ve may chu tai moi 10 s, KHONG chay bai do; can khi Bat=0 (mac dinh 0)
GuiLog=0
GiayMoiPha=60
Pha=0,1,2,3,4
LanLap=2

[WAuto]
; [ANDROID 11/09 WAUTO B0] Bang WAuto TRONG GAME (bo nao WAuto da nam san trong libCoreClient.so; xem LOTRINH_WAUTO_MOBILE_1109.md).
; 1 = bat may auto ngay khi vao game. Cau hinh doc tu APdata\<ma nhan vat>.dat - CUNG dinh dang va ten tep voi WAuto.exe
;     ben PC, chep tep APdata cua PC sang la dung duoc; chua co tep thi dung mac dinh lan dau cua WAuto (danh + nhat +
;     uong thuoc) va tu ghi ra tep. Cong tac tam cho B0; tu B1 co nut BAT / TAT trong game. 0 = tat.
Bat=0
